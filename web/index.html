<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Mode Visualizer</title>
<style>
  :root {
    --tier: #00d7ff;
    --intensity: 0;          /* 0 at LOW, 1 at MAX — scales every glow */
    --bg: #05060a;
    --seg-off: #171b24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: #e7ecf5;
    font: 400 16px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }

  /* ── atmosphere ───────────────────────────────────────────── */

  .aura {
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 46%,
        color-mix(in srgb, var(--tier) calc(12% + var(--intensity) * 42%), transparent),
        transparent calc(38% + var(--intensity) * 26%));
    opacity: calc(.55 + var(--intensity) * .45);
    transition: background 700ms ease, opacity 700ms ease;
    /* only transform/opacity here: a viewport-sized filter or blur repaints
       every frame and tanks the framerate */
    animation: breathe calc(4s - var(--intensity) * 2.4s) ease-in-out infinite;
    will-change: transform;
  }
  @keyframes breathe { 50% { transform: scale(1.07); } }

  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    /* a gradient rather than a 300px inset box-shadow, which is far cheaper */
    background: radial-gradient(circle at 50% 46%, transparent 46%,
                color-mix(in srgb, var(--tier) calc(var(--intensity) * 34%), transparent) 100%);
    transition: background 700ms ease;
  }

  .scanlines {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: calc(var(--intensity) * .16);
    background: repeating-linear-gradient(
      0deg, transparent 0 2px, color-mix(in srgb, var(--tier) 55%, transparent) 2px 3px);
    transition: opacity 700ms ease;
  }

  /* ── lightning + flash ────────────────────────────────────── */

  /* One filter for the whole layer. Per-path drop-shadows rasterize
     separately and stall the compositor once a few dozen bolts are live. */
  .bolts {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 4;
    filter: drop-shadow(0 0 7px var(--tier)) drop-shadow(0 0 20px var(--tier));
  }
  .bolts path {
    fill: none;
    stroke: #fff;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: strike 620ms ease-out forwards;
  }
  @keyframes strike {
    0%   { opacity: 0; }
    6%   { opacity: 1; }
    14%  { opacity: .15; }
    22%  { opacity: 1; }
    38%  { opacity: .4; }
    52%  { opacity: .95; }
    100% { opacity: 0; }
  }

  .flash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 46%, #fff, var(--tier) 45%, transparent 78%);
  }
  .flash.on { animation: blast var(--flash-ms, 700ms) ease-out; }
  @keyframes blast {
    0%   { opacity: 0; }
    5%   { opacity: var(--flash-peak, .75); }
    18%  { opacity: .12; }
    30%  { opacity: calc(var(--flash-peak, .75) * .7); }
    100% { opacity: 0; }
  }

  /* ── stage ────────────────────────────────────────────────── */

  .stage {
    position: relative;
    z-index: 3;
    width: min(780px, 92vw);
    display: grid;
    gap: 32px;
    justify-items: center;
    text-align: center;
  }
  .stage.shake { animation: shake var(--shake-ms, 450ms) cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-9px, 2px) rotate(-.4deg); }
    40%, 60% { transform: translate(9px, -1px) rotate(.4deg); }
  }

  .banner {
    height: 32px;
    font-size: 15px;
    letter-spacing: .45em;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    text-shadow: 0 0 10px #fff, 0 0 30px var(--tier), 0 0 60px var(--tier);
  }
  .banner.on { animation: flare 1.6s ease-out; }
  @keyframes flare {
    0%   { opacity: 0; transform: scale(.75); filter: blur(8px); }
    10%  { opacity: 1; transform: scale(1.18); filter: blur(0); }
    18%  { opacity: .3; }
    26%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; }
  }

  .tier-name {
    font-size: clamp(46px, 10vw, 104px);
    font-weight: 800;
    letter-spacing: .12em;
    line-height: 1;
    color: #fff;
    text-shadow:
      0 0 calc(6px + var(--intensity) * 10px) #fff,
      0 0 calc(24px + var(--intensity) * 40px) var(--tier),
      0 0 calc(60px + var(--intensity) * 120px) var(--tier);
    transition: text-shadow 500ms ease;
  }
  .tier-name.pop { animation: pop 560ms cubic-bezier(.2,1.6,.35,1); }
  @keyframes pop { 0% { transform: scale(.82); } 55% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* Rotating conic border. @property makes --angle animatable, which keeps
     the sweep on one element instead of a stack of spinning divs. */
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

  .meter-frame { position: relative; padding: 12px 16px; border-radius: 14px; }
  .meter-frame::before,
  .meter-frame::after {
    content: '';
    position: absolute;
    border-radius: 16px;
    padding: 3px;
    /* --ring is set on the element by JS, so visibility never depends on
       pseudo-element cascade order */
    opacity: 0;
    transition: opacity 500ms ease;
    /* mask out the middle so only the ring paints */
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
  }
  .meter-frame::before {
    inset: -4px;
    background: conic-gradient(from var(--angle),
      transparent 0 42%, var(--tier) 47%, #fff 50%, var(--tier) 53%, transparent 58% 100%);
    filter: drop-shadow(0 0 10px var(--tier));
  }
  .meter-frame::after {
    inset: -11px;
    padding: 2px;
    background: conic-gradient(from var(--angle),
      transparent 0 60%, color-mix(in srgb, var(--tier) 80%, transparent) 72%, #fff 78%, transparent 88% 100%);
  }
  .meter-frame::before { opacity: var(--ring, 0); animation: sweep 1.7s linear infinite; }
  .meter-frame::after  { opacity: calc(var(--ring, 0) * .85); animation: sweep 2.6s linear infinite reverse; }
  @keyframes sweep { to { --angle: 360deg; } }

  /* expanding shockwave ring on entering MAX */
  .shock {
    position: fixed;
    border: 2px solid var(--tier);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 0 30px var(--tier), inset 0 0 30px var(--tier);
    animation: shockwave var(--life, 900ms) cubic-bezier(.1,.7,.3,1) forwards;
  }
  @keyframes shockwave {
    from { opacity: .95; transform: translate(-50%, -50%) scale(.05); }
    to   { opacity: 0;   transform: translate(-50%, -50%) scale(1); }
  }

  .meter { display: flex; gap: 7px; }
  .seg {
    width: clamp(16px, 3.4vw, 32px);
    height: 62px;
    border-radius: 4px;
    background: var(--seg-off);
    transition: background 240ms ease, box-shadow 240ms ease, transform 240ms ease;
  }
  .seg.lit {
    background: linear-gradient(180deg, #fff, var(--tier) 38%, var(--tier));
    box-shadow:
      0 0 calc(12px + var(--intensity) * 18px) var(--tier),
      0 0 calc(34px + var(--intensity) * 60px) color-mix(in srgb, var(--tier) 70%, transparent);
    transform: scaleY(calc(1.06 + var(--intensity) * .12));
  }
  .meter.charged .seg.lit { animation: shimmer calc(1.6s - var(--intensity) * .9s) ease-in-out infinite; }
  @keyframes shimmer { 50% { filter: brightness(1.45); } }

  /* the slider track blowing out when the top rung lands */
  .slider-wrap { position: relative; }
  .slider-wrap.blown::before {
    content: '';
    position: absolute; inset: -18px -10px auto -10px; height: 60px;
    border-radius: 99px;
    background: radial-gradient(ellipse at center, #fff, var(--tier) 40%, transparent 72%);
    pointer-events: none;
    animation: blowout 900ms ease-out forwards;
  }
  @keyframes blowout {
    0%   { opacity: 0; transform: scaleX(.2); filter: blur(0); }
    12%  { opacity: 1; transform: scaleX(1.04); }
    40%  { opacity: .5; }
    100% { opacity: 0; transform: scaleX(1.12); }
  }

  /* the whole meter beating while a storm runs */
  body.storm .meter-frame { animation: heartbeat calc(1.5s - var(--rage, 0) * .6s) ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    8%       { transform: scale(1.035); }
    16%      { transform: scale(1); }
    24%      { transform: scale(1.02); }
  }

  .readout { font-size: 14px; letter-spacing: .2em; color: #7c879b; }
  .readout b { color: var(--tier); font-weight: 700; text-shadow: 0 0 12px var(--tier); }

  /* ── slider ───────────────────────────────────────────────── */

  .slider-wrap { width: 100%; display: grid; gap: 14px; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 10px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--tier) calc(var(--pct) * 1%), var(--seg-off) calc(var(--pct) * 1%));
    box-shadow: 0 0 calc(var(--intensity) * 30px) color-mix(in srgb, var(--tier) 70%, transparent);
    outline: none; cursor: grab;
    transition: background 240ms ease, box-shadow 500ms ease;
  }
  input[type=range]:active { cursor: grabbing; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px; border-radius: 50%;
    background: #fff; border: 4px solid var(--tier);
    box-shadow: 0 0 calc(18px + var(--intensity) * 34px) var(--tier);
    transition: border-color 240ms ease, box-shadow 500ms ease, transform 160ms ease;
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 4px solid var(--tier);
    box-shadow: 0 0 calc(18px + var(--intensity) * 34px) var(--tier);
  }

  .ticks { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .18em; color: #59637a; }
  .ticks span { flex: 1; transition: color 240ms ease, text-shadow 240ms ease; }
  .ticks span:first-child { text-align: left; }
  .ticks span:last-child { text-align: right; }
  .ticks span.active { color: #fff; font-weight: 700; text-shadow: 0 0 14px var(--tier); }

  .hint { font-size: 12px; letter-spacing: .12em; color: #49566e; }

  .spark {
    position: fixed;
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px var(--tier), 0 0 22px var(--tier);
    pointer-events: none; z-index: 5;
    animation: fly var(--life, 900ms) cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes fly {
    from { opacity: 1; transform: translate(0, 0) scale(1); }
    to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.15); }
  }

  /* ── MAX overload ─────────────────────────────────────────── */

  @keyframes neon {
    0%, 42%, 46%, 52%, 100% { opacity: 1; }
    44%, 49% { opacity: .55; }
  }
  body.storm { background: #0d0500; }
  body.peak { background: #12000a; }
  body.storm .aura { animation-duration: calc(1.9s - var(--rage, 0) * .8s); }
  body.storm .scanlines {
    opacity: calc(.18 + var(--rage, 0) * .14);
    animation: crawl calc(1.4s - var(--rage, 0) * .5s) linear infinite;
  }
  @keyframes crawl { to { background-position: 0 6px; } }

  /* pressure closing in from the edges */
  body.storm .vignette {
    background: radial-gradient(circle at 50% 46%, transparent 28%, rgba(0,0,0,.72) 74%,
                color-mix(in srgb, var(--tier) 60%, transparent) 100%);
    animation: clamp-in 1.9s ease-in-out infinite;
  }
  @keyframes clamp-in { 50% { transform: scale(1.09); opacity: .78; } }

  body.storm::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 2;
    background: radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--tier) 40%, transparent), transparent 66%);
    animation: overload 1.15s ease-in-out infinite;
  }
  @keyframes overload { 0%, 100% { opacity: .85; } 50% { opacity: .25; } }

  body.storm .tier-name {
    animation: neon 2.6s linear infinite;
    letter-spacing: .2em;
  }
  body.storm .seg.lit { animation-duration: calc(.85s - var(--rage, 0) * .4s); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 80ms !important; }
  }
</style>
</head>
<body>
  <div class="aura"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <svg class="bolts" id="bolts" aria-hidden="true"></svg>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="banner" id="banner"></div>
    <h1 class="tier-name" id="tierName">LOW</h1>
    <div class="meter-frame" id="meterFrame">
      <div class="meter" id="meter" aria-hidden="true"></div>
    </div>
    <p class="readout"><b id="pct">20%</b> &nbsp;·&nbsp; <b id="key">3</b> / 15 power</p>

    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="5" step="1" value="0"
             aria-label="Thinking effort level">
      <div class="ticks" id="ticks"></div>
    </div>

    <p class="hint" id="hint">drag the slider &nbsp;·&nbsp; or use ← → arrow keys</p>
  </main>

<script>
const TIERS = [
  { key: 'low',    name: 'LOW',    color: '#00d7ff' },
  { key: 'medium', name: 'MEDIUM', color: '#00ff87' },
  { key: 'high',   name: 'HIGH',   color: '#ffff00' },
  { key: 'xhigh',     name: 'XHIGH',     color: '#ff8700' },
  { key: 'max',       name: 'MAX',       color: '#ff005f' },
  { key: 'ultracode', name: 'ULTRACODE', color: '#b76bff' },
];
const SEGMENTS_PER_TIER = 3;
const TOTAL_SEGMENTS = TIERS.length * SEGMENTS_PER_TIER;
const MAX_INDEX = TIERS.length - 1;
const STORM_FROM = 3;            // xhigh and up run the storm, escalating
const SVG_NS = 'http://www.w3.org/2000/svg';

const el = (id) => document.getElementById(id);
const stage = el('stage'), meter = el('meter'), slider = el('slider'), bolts = el('bolts');
const root = document.documentElement;
let current = 0;
let stormTimer = null;
let crackleTimer = null;

meter.innerHTML = Array.from({ length: TOTAL_SEGMENTS }, () => '<i class="seg"></i>').join('');
el('ticks').innerHTML = TIERS.map((t) => `<span>${t.name}</span>`).join('');

const segments = [...meter.children];
const tickLabels = [...el('ticks').children];

const MAX_LIVE_BOLTS = 70;

/* animationend is unreliable once the page is busy, so every transient node
   also gets a hard timer. Without this they pile up and starve the renderer. */
function transient(node, parent, ms) {
  parent.appendChild(node);
  setTimeout(() => node.remove(), ms);
}

function replay(node, className) {
  node.classList.remove(className);
  void node.offsetWidth;                       // force reflow to restart the animation
  node.classList.add(className);
}

/* Jagged polyline from (x1,y1) to (x2,y2), displaced perpendicular to the run. */
function boltPath(x1, y1, x2, y2, steps, spread) {
  const dx = x2 - x1, dy = y2 - y1;
  const length = Math.hypot(dx, dy) || 1;
  const nx = -dy / length, ny = dx / length;   // unit normal

  let d = `M ${x1} ${y1}`;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const taper = Math.sin(t * Math.PI);       // no wander at the endpoints
    const offset = (Math.random() - 0.5) * spread * taper;
    d += ` L ${x1 + dx * t + nx * offset} ${y1 + dy * t + ny * offset}`;
  }
  return d + ` L ${x2} ${y2}`;
}

function strike(count, { thick = 2.4, spread = 90 } = {}) {
  if (bolts.childElementCount > MAX_LIVE_BOLTS) return;
  const target = meter.getBoundingClientRect();
  const midY = target.top + target.height / 2;

  for (let i = 0; i < count; i++) {
    const path = document.createElementNS(SVG_NS, 'path');
    const originX = Math.random() * window.innerWidth;
    const hitX = target.left + Math.random() * target.width;
    path.setAttribute('d', boltPath(originX, -40, hitX, midY, 14 + Math.floor(Math.random() * 8), spread));
    path.setAttribute('stroke-width', (thick * (0.5 + Math.random())).toFixed(2));
    path.style.animationDelay = `${Math.random() * 160}ms`;
    transient(path, bolts, 900);

    // a fainter fork trailing off the main channel
    if (Math.random() > 0.45) {
      const fork = document.createElementNS(SVG_NS, 'path');
      fork.setAttribute('d', boltPath(hitX, midY, hitX + (Math.random() - 0.5) * 340, midY - 140 - Math.random() * 160, 8, 60));
      fork.setAttribute('stroke-width', '1.2');
      fork.style.opacity = '.6';
      fork.style.animationDelay = `${Math.random() * 200}ms`;
      transient(fork, bolts, 900);
    }
  }
}

/* Bolts firing outward from the middle of the meter in every direction. */
function radiate(count, { thick = 2.2, spread = 60, reach = 1 } = {}) {
  if (bolts.childElementCount > MAX_LIVE_BOLTS) return;
  const rect = meter.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const span = Math.max(window.innerWidth, window.innerHeight) * 0.62 * reach;

  for (let i = 0; i < count; i++) {
    // even angular spacing with jitter, so the burst reads as a star not a clump
    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const distance = span * (0.55 + Math.random() * 0.65);
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', boltPath(
      cx, cy,
      cx + Math.cos(angle) * distance,
      cy + Math.sin(angle) * distance,
      10 + Math.floor(Math.random() * 8), spread));
    path.setAttribute('stroke-width', (thick * (0.45 + Math.random())).toFixed(2));
    path.style.animationDelay = `${Math.random() * 130}ms`;
    transient(path, bolts, 850);
  }
}

/* Lightning running along a horizontal element — used for the slider track
   and the meter, so the bar itself looks electrified rather than just lit. */
function arcAlong(rect, count, { thick = 1.6, spread = 26 } = {}) {
  if (bolts.childElementCount > MAX_LIVE_BOLTS) return;
  for (let i = 0; i < count; i++) {
    const y = rect.top + rect.height / 2;
    const from = rect.left + Math.random() * rect.width * 0.4;
    const to = from + rect.width * (0.35 + Math.random() * 0.6);
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', boltPath(from, y, Math.min(to, rect.right), y, 12, spread));
    path.setAttribute('stroke-width', (thick * (0.6 + Math.random())).toFixed(2));
    path.style.animationDelay = `${Math.random() * 220}ms`;
    transient(path, bolts, 900);
  }
}

/* The slider detonating when the top rung lands. */
function explodeBar() {
  const wrap = slider.parentElement;
  const rect = slider.getBoundingClientRect();
  replay(wrap, 'blown');

  arcAlong(rect, 7, { thick: 2.6, spread: 40 });

  // bolts leaping off the track, up and down
  for (let i = 0; i < 16; i++) {
    const x = rect.left + Math.random() * rect.width;
    const y = rect.top + rect.height / 2;
    const path = document.createElementNS(SVG_NS, 'path');
    const rise = (120 + Math.random() * 230) * (Math.random() > 0.55 ? -1 : 1);
    path.setAttribute('d', boltPath(x, y, x + (Math.random() - 0.5) * 260, y + rise, 9, 48));
    path.setAttribute('stroke-width', (1.4 + Math.random() * 2).toFixed(2));
    path.style.animationDelay = `${Math.random() * 200}ms`;
    transient(path, bolts, 900);
  }

  // sparks spraying along the full length of the track
  for (let i = 0; i < 46; i++) {
    const spark = document.createElement('div');
    const angle = (Math.random() - 0.5) * Math.PI * 1.6 - Math.PI / 2;
    const distance = 80 + Math.random() * 260;
    spark.className = 'spark';
    spark.style.left = `${rect.left + Math.random() * rect.width}px`;
    spark.style.top = `${rect.top + rect.height / 2}px`;
    spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
    spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
    spark.style.setProperty('--life', `${600 + Math.random() * 700}ms`);
    transient(spark, document.body, 1500);
  }
}

function shockwave(size, ms) {
  const rect = meter.getBoundingClientRect();
  const ring = document.createElement('div');
  ring.className = 'shock';
  ring.style.width = ring.style.height = `${size}px`;
  ring.style.left = `${rect.left + rect.width / 2}px`;
  ring.style.top = `${rect.top + rect.height / 2}px`;
  ring.style.setProperty('--life', `${ms}ms`);
  transient(ring, document.body, ms + 200);
}

function emitSparks(count, power) {
  const rect = meter.getBoundingClientRect();
  for (let i = 0; i < count; i++) {
    const spark = document.createElement('div');
    const angle = Math.random() * Math.PI * 2;
    const distance = (90 + Math.random() * 240) * power;
    spark.className = 'spark';
    spark.style.left = `${rect.left + Math.random() * rect.width}px`;
    spark.style.top = `${rect.top + Math.random() * rect.height}px`;
    spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
    spark.style.setProperty('--dy', `${Math.sin(angle) * distance - 60}px`);
    spark.style.setProperty('--life', `${700 + Math.random() * 600}ms`);
    transient(spark, document.body, 1500);
  }
}

function flash(peak, ms) {
  const node = el('flash');
  node.style.setProperty('--flash-peak', peak);
  node.style.setProperty('--flash-ms', `${ms}ms`);
  replay(node, 'on');
}

/* At MAX the storm keeps going instead of firing once. */
function setStorm(index) {
  const storming = index >= STORM_FROM;
  const peak = index === MAX_INDEX;
  // 0 at XHIGH, .5 at MAX, 1 at ULTRACODE
  const rage = storming ? (index - STORM_FROM) / (MAX_INDEX - STORM_FROM) : 0;
  document.body.classList.toggle('storm', storming);
  document.body.classList.toggle('peak', peak);
  document.body.style.setProperty('--rage', rage.toFixed(2));
  el('meterFrame').style.setProperty('--ring', storming ? (0.6 + rage * 0.4).toFixed(2) : '0');
  if (stormTimer) { clearInterval(stormTimer); stormTimer = null; }
  if (crackleTimer) { clearInterval(crackleTimer); crackleTimer = null; }
  if (!storming) return;

  // fast layer: constant crackle so the screen never sits still
  crackleTimer = setInterval(() => {
    arcAlong(meter.getBoundingClientRect(), 1 + Math.round(rage * 2), { thick: 1.4 });
    if (Math.random() < 0.5 + rage * 0.4) {
      arcAlong(slider.getBoundingClientRect(), 1 + Math.round(rage), { thick: 1.2, spread: 20 });
    }
    if (Math.random() < 0.35 + rage * 0.45) radiate(2 + Math.round(rage * 3), { thick: 1.3, spread: 45, reach: 0.5 });
    if (Math.random() < 0.3) flash(0.05 + rage * 0.06, 260);
  }, 260 - rage * 110);

  let beat = 0;
  stormTimer = setInterval(() => {
    beat++;
    if (beat % 3 === 0) {
      // every third beat, a full radial discharge
      radiate(6 + Math.round(rage * 8) + Math.floor(Math.random() * 6), { thick: 1.9 + rage, spread: 70 });
      shockwave(Math.min(window.innerWidth, window.innerHeight) * (0.6 + rage * 0.45), 800);
      flash(0.2 + rage * 0.2, 520);
      emitSparks(12 + Math.round(rage * 14), 1);
    } else {
      radiate(2 + Math.round(rage * 3) + Math.floor(Math.random() * 4), { thick: 1.6, spread: 55, reach: 0.7 });
      strike(1 + Math.round(rage), { thick: 1.8, spread: 110 });
      flash(0.09 + rage * 0.07, 380);
    }
  }, 1500 - rage * 750);
}

function celebrate(index, previous) {
  const jump = index - previous;
  const power = (index + 1) / TIERS.length;

  const banner = el('banner');
  banner.textContent = jump > 0 ? '⚡ POWER UP ⚡' : 'POWER DOWN';
  replay(banner, 'on');
  replay(el('tierName'), 'pop');

  if (jump < 0) {
    flash(0.18, 420);
    return;
  }

  stage.style.setProperty('--shake-ms', `${380 + jump * 90}ms`);
  replay(stage, 'shake');
  strike(2 + Math.round(power * 5) + jump, { thick: 1.8 + power * 2.6, spread: 70 + power * 90 });
  emitSparks(Math.round(18 + power * 46), power);

  if (index !== MAX_INDEX) {
    flash(0.3 + power * 0.4, 620);
    if (index >= STORM_FROM) {
      radiate(14, { thick: 2.6, spread: 80, reach: 1 });
      shockwave(Math.max(window.innerWidth, window.innerHeight) * 0.8, 900);
      emitSparks(40, 1.1);
      arcAlong(slider.getBoundingClientRect(), 4, { thick: 2 });
      arcAlong(meter.getBoundingClientRect(), 5, { thick: 2.2, spread: 36 });
    }
    return;
  }

  // MAX: everything at once — a star of bolts out of the core, stacked
  // shockwaves, and a long white-out.
  radiate(28, { thick: 3.8, spread: 95, reach: 1.35 });
  emitSparks(80, 1.5);
  flash(1, 1600);
  explodeBar();
  arcAlong(meter.getBoundingClientRect(), 8, { thick: 3, spread: 44 });
  const reach = Math.max(window.innerWidth, window.innerHeight) * 1.15;
  [0, 140, 300].forEach((delay, i) => {
    setTimeout(() => {
      shockwave(reach, 1000 + i * 200);
      if (i) radiate(12, { thick: 2.2, spread: 70, reach: 0.9 });
    }, delay);
  });
}

function render(index, previous) {
  const tier = TIERS[index];
  const lit = (index + 1) * SEGMENTS_PER_TIER;

  root.style.setProperty('--tier', tier.color);
  root.style.setProperty('--intensity', (index / MAX_INDEX).toFixed(3));
  slider.style.setProperty('--pct', (index / MAX_INDEX) * 100);

  segments.forEach((seg, i) => {
    seg.classList.toggle('lit', i < lit);
    seg.style.transitionDelay = i < lit ? `${i * 26}ms` : '0ms';
  });
  meter.classList.toggle('charged', index >= 2);

  el('tierName').textContent = tier.name;
  el('pct').textContent = Math.round((lit / TOTAL_SEGMENTS) * 100) + '%';
  el('key').textContent = lit;
  tickLabels.forEach((label, i) => label.classList.toggle('active', i === index));

  setStorm(index);
  if (previous !== null && previous !== index) celebrate(index, previous);
}

slider.addEventListener('input', () => {
  const next = Number(slider.value);
  if (next === current) return;
  const previous = current;
  current = next;
  render(current, previous);
  pushLevel(TIERS[current].key);
});

/* ── bridge ───────────────────────────────────────────────────────────
   Served over http:// by bridge.py, the slider writes the real
   effortLevel and mirrors changes you make from Claude Code itself.
   Opened as a file:// page it stays a self-contained demo.            */

const BRIDGED = location.protocol.startsWith('http');
let lastServerLevel = null;

function setTo(index, animate) {
  if (index === current) return;
  const previous = current;
  current = index;
  slider.value = String(index);
  render(current, animate ? previous : null);
}

async function pushLevel(key) {
  if (!BRIDGED) return;
  try {
    const res = await fetch('/level', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ level: key }),
    });
    lastServerLevel = (await res.json()).level;
  } catch (_) {
    el('hint').textContent = 'bridge unreachable — is bridge.py still running?';
  }
}

/* Poll so /effort typed in Claude Code moves the slider too. ULTRACODE is
   stored as xhigh, so an incoming xhigh never yanks you off that rung. */
async function pollLevel() {
  try {
    const { level } = await (await fetch('/level')).json();
    if (!level || level === lastServerLevel) return;
    lastServerLevel = level;
    const onUltracode = TIERS[current].key === 'ultracode' && level === 'xhigh';
    const index = TIERS.findIndex((t) => t.key === level);
    if (index >= 0 && !onUltracode) setTo(index, true);
  } catch (_) { /* server gone; keep the page usable */ }
}

async function startBridge() {
  el('hint').innerHTML = 'drag the slider &nbsp;·&nbsp; changes are written to settings.json';
  try {
    const { level } = await (await fetch('/level')).json();
    lastServerLevel = level;
    const index = TIERS.findIndex((t) => t.key === level);
    if (index >= 0) setTo(index, false);
  } catch (_) { /* fall through to the default rung */ }
  setInterval(pollLevel, 1500);
}

render(0, null);
if (BRIDGED) startBridge();
</script>
</body>
